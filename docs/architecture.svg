<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="system-ui,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa3b8"/>
    </marker>
  </defs>
  <rect width="860" height="560" fill="#0b0e17"/>
  <text x="30" y="40" fill="#e8ecf6" font-size="22" font-weight="700">AI Safety &amp; Red Teaming — architecture</text>
  <text x="30" y="62" fill="#9aa3b8" font-size="13">Attack corpus → runner → analyzer → OWASP categorizer → guardrails → report</text>

  <!-- corpus -->
  <rect x="30" y="90" width="200" height="96" rx="10" fill="#141826" stroke="url(#acc)"/>
  <text x="46" y="116" fill="#22d3ee" font-size="13" font-weight="700">Attack corpus</text>
  <text x="46" y="138" fill="#9aa3b8" font-size="11.5">106 own attacks · 10 OWASP</text>
  <text x="46" y="156" fill="#9aa3b8" font-size="11.5">HarmBench + JailbreakBench</text>
  <text x="46" y="174" fill="#9aa3b8" font-size="11.5">+ LLM red-teamer variants</text>

  <!-- runner -->
  <rect x="330" y="90" width="200" height="96" rx="10" fill="#141826" stroke="#2a3350"/>
  <text x="346" y="116" fill="#e8ecf6" font-size="13" font-weight="700">Red-team runner</text>
  <text x="346" y="138" fill="#9aa3b8" font-size="11.5">async, bounded concurrency</text>
  <text x="346" y="156" fill="#9aa3b8" font-size="11.5">trace_id · latency · tokens</text>
  <text x="346" y="174" fill="#9aa3b8" font-size="11.5">cost per attack</text>

  <!-- targets -->
  <rect x="630" y="90" width="200" height="96" rx="10" fill="#141826" stroke="#2a3350"/>
  <text x="646" y="116" fill="#e8ecf6" font-size="13" font-weight="700">Targets</text>
  <text x="646" y="138" fill="#9aa3b8" font-size="11.5">HttpTarget (httpx, tenacity)</text>
  <text x="646" y="156" fill="#9aa3b8" font-size="11.5">chat=P01 · research=P03</text>
  <text x="646" y="174" fill="#9aa3b8" font-size="11.5">synthetic (eval/demo)</text>

  <!-- analyzer -->
  <rect x="330" y="230" width="200" height="96" rx="10" fill="#141826" stroke="#2a3350"/>
  <text x="346" y="256" fill="#e8ecf6" font-size="13" font-weight="700">Response analyzer</text>
  <text x="346" y="278" fill="#9aa3b8" font-size="11.5">refusal? compliance?</text>
  <text x="346" y="296" fill="#9aa3b8" font-size="11.5">PII leak? DoS?</text>
  <text x="346" y="314" fill="#9aa3b8" font-size="11.5">+ optional LLM-as-judge</text>

  <!-- detectors -->
  <rect x="630" y="230" width="200" height="96" rx="10" fill="#141826" stroke="#2a3350"/>
  <text x="646" y="256" fill="#e8ecf6" font-size="13" font-weight="700">Detectors</text>
  <text x="646" y="278" fill="#9aa3b8" font-size="11.5">regex (always-on)</text>
  <text x="646" y="296" fill="#9aa3b8" font-size="11.5">ML: DeBERTa, toxic-bert,</text>
  <text x="646" y="314" fill="#9aa3b8" font-size="11.5">Presidio (lazy, Protocol)</text>

  <!-- guardrails -->
  <rect x="30" y="230" width="200" height="96" rx="10" fill="#141826" stroke="url(#acc)"/>
  <text x="46" y="256" fill="#22d3ee" font-size="13" font-weight="700">Guardrails</text>
  <text x="46" y="278" fill="#9aa3b8" font-size="11.5">input screen (block)</text>
  <text x="46" y="296" fill="#9aa3b8" font-size="11.5">output sanitize (redact)</text>
  <text x="46" y="314" fill="#9aa3b8" font-size="11.5">latency measured</text>

  <!-- categorizer -->
  <rect x="330" y="370" width="200" height="80" rx="10" fill="#141826" stroke="#2a3350"/>
  <text x="346" y="396" fill="#e8ecf6" font-size="13" font-weight="700">OWASP categorizer</text>
  <text x="346" y="418" fill="#9aa3b8" font-size="11.5">success rate per LLM01–LLM10</text>
  <text x="346" y="436" fill="#9aa3b8" font-size="11.5">before vs after guardrails · FP rate</text>

  <!-- outputs -->
  <rect x="30" y="470" width="240" height="66" rx="10" fill="#141826" stroke="#2a3350"/>
  <text x="46" y="496" fill="#e8ecf6" font-size="13" font-weight="700">eval/RESULTS.md + runs/*.json</text>
  <text x="46" y="518" fill="#9aa3b8" font-size="11.5">reproducible mandatory table</text>

  <rect x="330" y="470" width="240" height="66" rx="10" fill="#141826" stroke="#2a3350"/>
  <text x="346" y="496" fill="#e8ecf6" font-size="13" font-weight="700">PDF security report</text>
  <text x="346" y="518" fill="#9aa3b8" font-size="11.5">reportlab · per target</text>

  <rect x="630" y="470" width="200" height="66" rx="10" fill="#141826" stroke="#2a3350"/>
  <text x="646" y="496" fill="#e8ecf6" font-size="13" font-weight="700">FastAPI + SQLite/PG</text>
  <text x="646" y="518" fill="#9aa3b8" font-size="11.5">/api/red-team · /api/runs</text>

  <!-- arrows -->
  <line x1="230" y1="138" x2="330" y2="138" stroke="#9aa3b8" marker-end="url(#arw)"/>
  <line x1="530" y1="138" x2="630" y2="138" stroke="#9aa3b8" marker-end="url(#arw)"/>
  <line x1="430" y1="186" x2="430" y2="230" stroke="#9aa3b8" marker-end="url(#arw)"/>
  <line x1="630" y1="278" x2="530" y2="278" stroke="#9aa3b8" marker-end="url(#arw)"/>
  <line x1="330" y1="278" x2="230" y2="278" stroke="#9aa3b8" marker-end="url(#arw)"/>
  <line x1="430" y1="326" x2="430" y2="370" stroke="#9aa3b8" marker-end="url(#arw)"/>
  <line x1="330" y1="410" x2="270" y2="470" stroke="#9aa3b8" marker-end="url(#arw)"/>
  <line x1="430" y1="450" x2="440" y2="470" stroke="#9aa3b8" marker-end="url(#arw)"/>
  <line x1="530" y1="410" x2="700" y2="470" stroke="#9aa3b8" marker-end="url(#arw)"/>
</svg>
